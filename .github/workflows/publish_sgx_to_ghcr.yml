name: Publish SGX Wallet Image to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the image to publish"
        required: true
        default: "e548b375cae741af8fd11db54d6925c27a947af9"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Push Image
        run: |
          SOURCE_IMAGE="skalenetwork/sgxwallet_sim:${{ inputs.tag }}"
          # Construct target image name. ensuring lowercase for the registry
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="ghcr.io/$OWNER/sgxwallet_sim:${{ inputs.tag }}"

          echo "Source: $SOURCE_IMAGE"
          echo "Target: $TARGET_IMAGE"

          echo "Pulling from Docker Hub..."
          docker pull "$SOURCE_IMAGE"

          echo "Tagging..."
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

          echo "Pushing to GHCR..."
          docker push "$TARGET_IMAGE"
