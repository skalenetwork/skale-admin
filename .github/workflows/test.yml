name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install python dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check

      - name: Export env
        run: |
          . ./scripts/export_env.sh
          printenv >> $GITHUB_ENV

      - name: Run sgx wallet sim
        run: |
          bash ./scripts/run_sgxwallet.sh

      - name: Deploy manager
        run: |
          bash ./helper-scripts/deploy_manager.sh
          docker rmi -f skalenetwork/skale-manager:$MANAGER_TAG

      - name: Deploy IMA
        run: |
          bash ./helper-scripts/deploy_ima.sh
          docker rmi -f skalenetwork/ima-contracts:$IMA_TAG

      - name: Run core tests
        run: |
          bash ./scripts/run_core_tests.sh

      - name: Cleanup docker artifacts
        run: |
          docker rm -f $(docker ps -aq)
