name: Test

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANAGER_TAG: 1.12.0-develop.21
  IMA_TAG: 2.3.0-beta.3
  SGX_WALLET_TAG: e548b375cae741af8fd11db54d6925c27a947af9

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install python dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check

      - name: Export env
        run: |
          . ./scripts/export_env.sh
          printenv >> $GITHUB_ENV

      - name: Cleanup runner
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/android-sdk || true
          sudo rm -rf /usr/local/share/android || true
          sudo rm -rf /usr/local/share/Android || true

      - name: Cache Docker images
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-images-v1-${{ runner.os }}-${{ env.MANAGER_TAG }}-${{ env.IMA_TAG }}

      - name: Load or Pull Docker images
        run: |
          mkdir -p /tmp/docker-images

          IMAGES=(
            "skalenetwork/skale-manager:$MANAGER_TAG"
            "skalenetwork/ima-contracts:$IMA_TAG"
          )

          for IMAGE in "${IMAGES[@]}"; do
            TAR_FILE="/tmp/docker-images/$(echo $IMAGE | tr '/:' '_').tar"

            if [ -f "$TAR_FILE" ]; then
              echo "Loading $IMAGE from cache..."
              docker load -i "$TAR_FILE"
            else
              echo "Pulling $IMAGE..."
              docker pull "$IMAGE"
              echo "Saving $IMAGE to cache..."
              docker save "$IMAGE" -o "$TAR_FILE"
            fi
          done

      - name: Deploy manager
        run: |
          bash ./helper-scripts/deploy_manager.sh
          docker rmi -f skalenetwork/skale-manager:$MANAGER_TAG

      - name: Deploy IMA
        run: |
          bash ./helper-scripts/deploy_ima.sh
          docker rmi -f skalenetwork/ima-contracts:$IMA_TAG

      - name: Run sgx wallet sim
        run: |
          bash ./scripts/run_sgxwallet.sh

      - name: Run core tests
        run: |
          bash ./scripts/run_core_tests.sh

      - name: Cleanup docker artifacts
        run: |
          docker rm -f $(docker ps -aq)
