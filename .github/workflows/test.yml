name: Test
on: [push]
env:
  ETH_PRIVATE_KEY: ${{ secrets.ETH_PRIVATE_KEY }}
  SCHAIN_TYPE: ${{ secrets.SCHAIN_TYPE }}
  MANAGER_TAG: "1.12.0-develop.21"
  MIRAGE_TAG: "0.0.1-develop.25"
  IMA_TAG: "2.3.0-beta.3"
  SGX_WALLET_TAG: "1.10.0-develop.3"
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  PYTHON_VERSION: 3.11
  ENDPOINT: http://127.0.0.1:8545
  RUN_ANVIL: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_core:
    runs-on: self-hosted
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SCHAIN_TYPE: ${{ secrets.SCHAIN_TYPE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install python dependencies
        run: |
          source ../.venv/bin/activate
          uv pip install -r requirements.txt --prerelease=allow
          uv pip install -r requirements-dev.txt

      - name: Checking formatting with ruff
        run: uv run ruff check

      - name: Deploy manager
        run: |
          bash ./helper-scripts/deploy_manager.sh
          docker rmi -f skalenetwork/skale-manager:${{ env.MANAGER_TAG }}
      
      - name: Deploy IMA
        run: |
          bash ./helper-scripts/deploy_ima.sh
          docker rmi -f skalenetwork/ima-contracts:${{ env.IMA_TAG }}

      - name: Show stats before tests
        if: always()
        run: |
          lsblk -f
          free -h

      - name: Run core tests
        run: |
          source ../.venv/bin/activate
          bash ./scripts/run_core_tests.sh

      - name: Cleanup docker artifacts
        run: |
          docker rm -f $(docker ps -aq)

      - name: Show stats after core tests
        if: always()
        run: |
          lsblk -f
          free -h

      - name: Run firewall tests
        run: |
          bash ./scripts/run_firewall_test.sh

      - name: Show stats after firewall tests
        if: always()
        run: |
          lsblk -f
          free -h

      - name: Cleanup docker artifacts
        if: always()
        run: |
          docker rm -f $(docker ps -aq)

      - name: Run codecov
        run: |
          source ../.venv/bin/activate
          codecov -t $CODECOV_TOKEN
