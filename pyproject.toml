[project]
name = "skale-admin"
version = "3.3.3"
requires-python = ">=3.14"
dependencies = [
    "peewee==4.5.3",
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "gunicorn==26.2.0",
    "Jinja2==3.1.6",
    "docker==7.2.0",
    "websocket-client==1.9.2",
    "requests==2.34.2",
    "ima-predeployed==2.3.0b3",
    "etherbase-predeployed==1.1.0b3",
    "marionette-predeployed==2.0.0b2",
    "config-controller-predeployed==1.1.0",
    "filestorage-predeployed==1.1.0.dev8",
    "multisigwallet-predeployed==1.1.0b0",
    "context-predeployed==1.0.0.dev3",
    "statsd==4.0.1",
    "psutil==7.2.2",
    "colorful==0.5.8",
    "celery==5.6.3",
    "filelock==4.2.4",
    "python-telegram-bot==22.8",
    "skale.py==8.0dev0",
    "APScheduler==3.11.3",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",                   # required by the nftables bindings
    "setuptools==81.0.0",                   # pkg_resources for predeployed packages, removed in 82
]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "mypy==2.4.0"]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "freezegun==1.5.5",
]

[tool.pytest.ini_options]
addopts = ["--durations=0", "--timeout=35", "--timeout-method=thread"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s] [%(levelname)8s] [%(threadName)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
extend-exclude = ["helper-scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
# todo: uncomment when types are added to all modules
# warn_return_any = true
# disallow_untyped_defs = true

[tool.coverage.run]
omit = ["tests/*", "helper-scripts/*"]
